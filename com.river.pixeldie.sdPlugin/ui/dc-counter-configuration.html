<!doctype html>
<html>
	<head lang="en">
		<title>Pixel Device Finder</title>
		<meta charset="utf-8" />
		<script src="./libs/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item id="device-container" label="Select">
			<sdpi-radio
				default="None selected"
				setting="deviceId"
				datasource="getDevices"
				loading="Scanning for devices..."
				hot-reload
			>
			</sdpi-radio>
		</sdpi-item>
		<sdpi-item id="counter-container" label="Counter Type">
			<sdpi-radio setting="type" columns="2">
				<option value="0">Plus</option>
				<option value="1">Minus</option>
			</sdpi-radio>
		</sdpi-item>
	</body>
</html>
